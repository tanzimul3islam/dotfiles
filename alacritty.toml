[font]
size = 17

[font.normal]
family = "UbuntuMono Nerd Font"

[window]
decorations = "none"

[window.padding]
x = 7
y = 0

[general]

# themes
import = ["~/.config/alacritty/themes/themes/gruvbox_dark.toml"]

[terminal]
osc52 = "CopyPaste"

[cursor]
style = { shape = "Beam" }

[selection]
save_to_clipboard = false

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[terminal.shell]
program = "tmux"
